# ════════════════════════════════════════════════════════════════════
# AID — 本地全栈开发环境
# ════════════════════════════════════════════════════════════════════
# 使用方式:
#   docker compose up -d          # 启动全部服务
#   docker compose logs -f api    # 查看 API 日志
#   docker compose down -v        # 停止并清理数据
# ════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 数据库 ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${PGUSER:-aid}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-alpha_id}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-aid} -d ${PGDATABASE:-alpha_id}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── API 服务 ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # --- 数据库 ---
      DATABASE_URL: postgresql://${PGUSER:-aid}:${PGPASSWORD}@db:5432/${PGDATABASE:-alpha_id}
      # --- 日志级别 ---
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # --- 环境标识 ---
      AID_ENV: ${AID_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
