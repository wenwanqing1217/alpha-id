[project]
name = "alpha-id-zix"
version = "0.3.3"
description = "你的数字灵魂 — 用 ChatGPT 导出认识自己，让所有 AI 工具认识同一个你"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "ai", "agent", "identity", "did", "decentralized-identity",
    "jwt", "authentication", "mcp", "llm", "chatgpt",
    "digital-twin", "skill-signing", "web4", "pypi",
]
authors = [
    { name = "wenwanqing1217", email = "wenwanqing1217@github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "PyJWT>=2.9",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "blinker>=1.7",
    "structlog>=24.0",
    "limits>=3.0",
    "chromadb>=0.5",
    "cachetools>=5.0",
    "tenacity>=8.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=1.0"]
fairy = ["openai>=1.0", "pyautogui>=0.9", "Pillow>=10.0"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
]

[project.urls]
Homepage = "https://github.com/wenwanqing1217/alpha-id"
Repository = "https://github.com/wenwanqing1217/alpha-id"
Documentation = "https://github.com/wenwanqing1217/alpha-id/tree/main/projects#readme"
Issues = "https://github.com/wenwanqing1217/alpha-id/issues"
Changelog = "https://github.com/wenwanqing1217/alpha-id/commits/main/"

[project.scripts]
aid = "alpha_id.cli:app"
aid-api = "main:app"
aid-mcp = "entrypoints.aid_mcp_server:main"
aid-daemon = "entrypoints.daemon:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aid*", "aid_*", "alpha_id*", "core*", "entrypoints*", "fairy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --no-header"
asyncio_default_fixture_loop_scope = "function"

[tool.pytest.ini_options.junit_family]
junit_family = "xunit2"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError",
    "HAS_",
]
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
include = ["src/core", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportMissingModuleSource = false
reportMissingParameterType = true
reportMissingTypeArgument = true
reportOptionalMemberAccess = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (Python 3.12+ 写法)
    "RUF", # ruff 专用规则
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N999",  # module name not lowercase (project convention)
]
fixable = ["ALL"]
unfixable = []
exclude = ["__pycache__", ".git", "htmlcov", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4
line-ending = "auto"

[tool.taskipy.tasks]
# 开发
dev = "aid-daemon"
dev-mcp = "aid-mcp"
web = "aid-api --reload"

# 测试
test = "python -m pytest tests/ -q --tb=short"
test-v = "python -m pytest tests/ -v --tb=long"
test-x = "python -m pytest tests/ -q --tb=short -x"  # 首次失败即停止
coverage = "python -m pytest tests/ -q --tb=short --cov=src --cov-report=term-missing"
coverage-html = "python -m pytest tests/ -q --tb=short --cov=src --cov-report=html"

# 代码质量
lint = "ruff check src/"
format = "ruff format src/ tests/"
typecheck = "pyright src/"
check-all = "ruff format --check src/ tests/ && ruff check src/ && pyright src/ && python -m pytest tests/ -q --tb=short"

# 数据库迁移
db-migrate = "alembic upgrade head"
db-rollback = "alembic downgrade -1"
db-history = "alembic history --verbose"
db-autogenerate = "alembic revision --autogenerate -m"

# 加密工具
encrypt-secret = "python -m src.core.secrets encrypt"

# 维护
clean = "python -c \"import shutil, pathlib; [shutil.rmtree(p) for p in pathlib.Path('.').rglob('__pycache__') if p.is_dir()]; [p.unlink() for p in pathlib.Path('.').rglob('*.pyc')]\""
pre-commit-run = "pre-commit run --all-files"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
follow_imports = "silent"
exclude = ["tests/"]

[tool.codespell]
skip = "*.pyc,*.git,*.db,*.png,*.jpg,htmlcov,node_modules,.venv"
ignore-words-list = "ba,hte"
check-hidden = true

# ── uv 依赖管理配置 ──
# 使用 uv 替代 pip：10-100x 更快，内置锁文件
# 安装 uv: pip install uv
# 使用: uv sync, uv add <pkg>, uv lock
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
    "pre-commit>=3.7",
]

[tool.uv.pip]
# 生成锁文件时包含 extras
all-extras = true

