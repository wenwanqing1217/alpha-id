[project]
name = "alpha-id"
version = "0.2.0"
description = "数字身份智能管理系统"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]
postgres = [
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "alpha-id[test,postgres]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src/core", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportMissingModuleSource = false
