name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Type check (pyright)
        run: uv run pyright src/core/ 2>&1 || true
        continue-on-error: true

      - name: Test core modules
        run: uv run pytest tests/ -v --tb=short --no-header -q
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Test with PostgreSQL (if secrets set)
        if: ${{ secrets.DATABASE_URL != '' }}
        run: uv run pytest tests/ -v -k "postgres or integration" --tb=short
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Coverage report
        run: uv run pytest tests/ --cov=src/core --cov-report=term --cov-report=xml --no-header -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
