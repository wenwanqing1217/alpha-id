# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板（默认通用）
template = generic

# 时区
timezone = UTC

# schema 版本表名
version_table = alembic_version

# 数据库 URL（从环境变量读取，fallback 到 SQLite）
sqlalchemy.url = sqlite:///./assets/alpha_id.db

# 迁移脚本命名
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# 输出编码
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
