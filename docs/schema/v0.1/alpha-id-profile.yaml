# Alpha-ID Profile Schema v0.1
# =============================
# 锁定日期：2026-06-05
# 向后兼容：永远只增不减，不删不改已有字段
# 新增字段用 x_ 前缀（如 x_custom_tag）
#
# 所有字段可为空，但不可删除。
# 解析器先读 profile_version，再按版本读内容。

profile_version: "0.1.0"          # 锁定，不可改
did: "did:aid:abc123..."          # 用户 DID
created_at: "2026-06-05T15:37:00Z" # 创建时间

# ─── 用户画像 ─────────────────────────────
persona:
  communication:
    tone: "direct"                 # direct |委婉|humorous|mixed
    sentence_length: "short"       # short |长句|mixed
    active_hours: [22, 23, 0, 1, 2] # 凌晨活跃
  technical:
    primary_languages: ["Python", "TypeScript"]
    framework_preferences: ["React", "FastAPI"]
    coding_style: "functional"     # functional | OOP | mixed
  temporal:
    work_rhythm: "night_owl"       # night_owl | morning | irregular
    focus_duration_minutes: 90

# ─── 记忆层 ───────────────────────────────
memory:
  episodic:                        # 时间线事件，只存引用不存全文
    - id: "ep_001"
      timestamp: "2026-06-02T14:30:00Z"
      source: "chatgpt_export"
      summary: "讨论 MCP 协议设计"
      importance: 0.8
  semantic:                        # 偏好图谱
    - entity: "MCP"
      relation: "interested_in"
      confidence: 0.9
      source: "ep_001"

# ─── 数据溯源审计 ──────────────────────────
provenance:
  - fact_id: "pref_001"
    source_file: "chatgpt_export_20260602.zip"
    extraction_method: "llm_gpt4o_mini"
    verified: false                # 用户可手动确认

# ─── 扩展字段（未来新增用 x_ 前缀）───────────
# x_custom_tag: []
# x_recovery_did: ""
